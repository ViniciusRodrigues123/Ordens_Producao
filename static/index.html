<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Ordens de Produção - Vasco</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="header-content">
        <img src="https://i.pinimg.com/originals/c3/05/a4/c305a460a9a9f921d1c679aab6da79da.png" alt="Cruz de Malta do Vasco" class="vasco-logo">
        <h1>Sistema de Ordens de Produção</h1>
    </div>
    <span id="status-badge">Verificando Servidor...</span>
</header>

<main>
    <section class="card">
        <h2>Nova Ordem de Produção</h2>
        <div class="form-grid">
            <div class="form-group">
                <label>Produto</label>
                <input type="text" id="input-produto" placeholder="Ex: Motor Elétrico WEG W22">
            </div>
            <div class="form-group">
                <label>Quantidade</label>
                <input type="number" id="input-qtd" placeholder="Ex: 100" min="1">
            </div>
            <div class="form-group">
                <label>Status Inicial</label>
                <select id="input-status">
                    <option value="Pendente">Pendente</option>
                    <option value="Em andamento">Em andamento</option>
                    <option value="Concluida">Concluída</option> 
                </select>
            </div>
        </div>
        <button id="btn-cadastrar">Cadastrar Ordem</button>
    </section>

    <section class="card">
        <div class="listagem-header">
            <h2>Ordens Cadastradas no Banco</h2>
            <button class="btn-secondary" id="btn-atualizar">Atualizar Lista</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Produto</th>
                    <th>Qtd</th>
                    <th>Status</th>
                    <th>Criado em</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo">
                <tr><td colspan="6" style="text-align: center; color: #a1a1aa; font-style: italic;">Carregando dados da API...</td></tr>
            </tbody>
        </table>
    </section>
</main>
<script src="script.js"></script>

</body>
</html>
